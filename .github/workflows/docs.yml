name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/index.html
          test -f openspec/specs/engineering-guardrails/spec.md

